<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Мастерская красоты — сайт студии в Москве</title>
  <desc id="desc">Фирменная молочная и вишнёвая палитра, выразительная типографика и две метафоры сайта: До кончиков пальцев и В каждом изгибе</desc>
  <rect width="1200" height="380" rx="28" fill="#fbf8f4"/>
  <g id="brand" fill="#622c3d">
    <text x="56" y="67" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" letter-spacing="4">МИХНЕВСКАЯ · МОСКВА</text>
    <text x="50" y="168" font-family="Georgia,serif" font-size="88">Мастерская</text>
    <text x="56" y="266" font-family="Georgia,serif" font-size="104" font-style="italic">красоты</text>
    <text x="56" y="326" fill="#5b5052" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="25">Ногтевой сервис и эстетика тела</text>
  </g>
  <g id="directions">
    <rect x="794" y="38" width="368" height="304" rx="24" fill="#f0e2e2"/>
    <text x="826" y="83" fill="#622c3d" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" letter-spacing="2">ДВА НАПРАВЛЕНИЯ ЗАБОТЫ</text>
    <text x="826" y="140" fill="#3d2530" font-family="Georgia,serif" font-size="36" font-style="italic">До кончиков</text>
    <text x="826" y="184" fill="#3d2530" font-family="Georgia,serif" font-size="36" font-style="italic">пальцев</text>
    <path d="M826 214H1130" stroke="#cdb8bd" stroke-width="1"/>
    <text x="826" y="265" fill="#3d2530" font-family="Georgia,serif" font-size="36" font-style="italic">В каждом</text>
    <text x="826" y="309" fill="#3d2530" font-family="Georgia,serif" font-size="36" font-style="italic">изгибе</text>
  </g>
</svg>
